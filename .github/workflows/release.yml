name: Build and Release CPA Manager Native

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Build frontend
        run: npm run build

      - name: Lint Rust backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  publish-tauri:
    name: Package (${{ matrix.label }})
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-15
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            rustTargets: aarch64-apple-darwin
          - label: macOS Intel
            platform: macos-15-intel
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            rustTargets: x86_64-apple-darwin
          - label: Linux x64
            platform: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
            rustTargets: ""
          - label: Windows x64
            platform: windows-latest
            args: "--bundles nsis"
            rustTargets: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 rpm

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        if: matrix.rustTargets == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with target
        if: matrix.rustTargets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: ${{ matrix.platform == 'ubuntu-22.04' && 'true' || '' }}
        with:
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'cpa-manager-native-v__VERSION__' }}
          releaseName: ${{ github.ref_type == 'tag' && format('CPA Manager Native {0}', github.ref_name) || 'CPA Manager Native v__VERSION__' }}
          releaseBody: |
            ## Changelog for 0.0.2

            ### Added
            - A system-aware theme preference alongside explicit light and dark modes.
            - A launch-at-startup preference backed by native operating-system integration.
            - An application data-directory picker with migration support that preserves the source directory.
            - A fixed manager configuration directory, separate from the movable component data directory.
            - Simplified Chinese documentation with English remaining the default README.
            - Product screenshots covering the dashboard, installed versions, health and logs, and tray menu.
            - Release packaging for macOS app/DMG and Linux deb/rpm/AppImage bundles.

            ### Changed
            - Reworked the light theme with a muted warm palette and accessible semantic color tokens.
            - Expanded the English README with setup, development, packaging, release, privacy, and troubleshooting guidance.
            - Improved settings feedback, pending states, and accessibility announcements.

            Full changelog: https://github.com/gcdd1993/CPA-Manager-native/blob/v0.0.2/CHANGELOG.md

            Assets are unsigned unless signing secrets are configured.
          releaseDraft: ${{ github.ref_type != 'tag' }}
          prerelease: false
          uploadWorkflowArtifacts: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: "[mainBinaryName]_[version]_[platform]_[arch][setup][ext]"
