[package]
name = "cpa-manager-native"
version = "0.0.6"
description = "Native manager for CLIProxyAPI and CPA-Manager-Plus"
authors = ["CPA Manager Native contributors"]
edition = "2021"

[lib]
name = "cpa_manager_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
futures-util = "0.3"
getrandom = "0.3"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
